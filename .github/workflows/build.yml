name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Oblivium-${{ matrix.name }}-VST3
          path: build/Oblivium_artefacts/Release/VST3/Oblivium.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Oblivium-${{ matrix.name }}-Standalone
          path: |
            build/Oblivium_artefacts/Release/Standalone/Oblivium
            build/Oblivium_artefacts/Release/Standalone/Oblivium.exe
          if-no-files-found: ignore
